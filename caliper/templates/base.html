<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Caliper{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version|default('1') }}">
  <script src="/static/app.js?v={{ asset_version|default('1') }}" defer></script>
</head>
<body data-page="{% block page_id %}app{% endblock %}" data-models-configured="{{ '1' if models_configured is defined and models_configured else '0' }}">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-head">
        <a class="brand" href="/">Caliper</a>
        <button class="theme-toggle" type="button" aria-label="Toggle dark mode">&#9681;</button>
      </div>
      <nav class="sidebar-projects">
        <a class="sidebar-project" href="/projects"><span class="sidebar-label">ALL PROJECTS</span></a>
        {% for project in projects %}
          <a class="sidebar-project" href="/projects/{{ project.id }}">{{ project.name }}</a>
        {% endfor %}
        <a class="sidebar-project add" href="/projects/new">+ New project</a>
      </nav>
      <nav class="sidebar-projects">
        <a class="sidebar-project" href="/settings/models"><span class="sidebar-label">SETTINGS</span> Models</a>
      </nav>
    </aside>
    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>
  <div class="toast" data-toast role="status" aria-live="polite" hidden></div>
</body>
</html>
