# graph.yaml — Caliper component graph (source of truth)
# .caliper/GRAPH.md is the human-readable view; this file is authoritative.
# CI graph-check fails if an edge or node path references a missing component.

nodes:
  - id: app-core
    path: caliper/main.py
    kind: application
    description: >
      FastAPI HTTP surface and composition root: dashboard, project list/create/detail
      with setup checklist, request composer, request page (plan/diff/review/actions),
      /health, the run() entrypoint (bind 127.0.0.1:8080 by default), the JSON API under
      /api for repository access, principles, project docs, environments and project
      deletion, and GET /api/events (Server-Sent Events).
  - id: workflow-engine
    path: caliper/workflow.py
    kind: domain
    description: >
      Synchronous pipeline submitted -> planning -> executing -> reviewing ->
      awaiting_approval (or a loop that re-runs Execution with the failed
      verdicts, the human note and the test output, max 3 executions, then
      failed). Preparation clones/syncs the project repository and creates one
      isolated worktree on caliper/<request id>; every attempt resets it to the
      recorded base commit. After Execution it stages the worktree, computes and
      validates the AUTHORITATIVE Git diff, commits, runs the project's mandatory
      test_command, then sends that diff plus the test output to Review.
      Approval re-checks the reviewed commit SHA, diff hash and a clean worktree,
      then asks request-workspace for a real `git merge --no-ff` and push. A
      conflict or rejected push marks the request failed with the exact reason;
      there is no merged.marker. Dev/Prod run only when a real deploy adapter is
      configured, otherwise DeploymentNotConfigured keeps the status merged.
      request_changes re-runs Execution against the same workspace. Owns artifact
      paths and review validation (verdicts must cover exactly the approved rule
      IDs; an invalid review counts as a failed loop and is shown on the request
      page) and takes the rule IDs of the project from its APPROVED principles.
  - id: request-workspace
    path: caliper/workspace.py
    kind: domain
    description: >
      RequestWorkspaceService: the only place that touches real Git for a request
      after planning. Clones/syncs the project repository, creates one worktree
      per request under projects/<id>/worktrees/<req> on caliper/<req>, resets it
      to the base commit before every attempt, applies model-produced diffs only
      through patch_safety, stages and computes the authoritative
      `git diff --cached <base>`, validates it, commits with Caliper's identity,
      runs the project's test_command (900 s timeout) inside the worktree, reads
      the test command from .caliper/manifest.yaml at the base commit, verifies the reviewed
      commit/diff hash and clean status, performs `git merge --no-ff` plus a push
      with the deploy key, aborts conflicts, resets on push rejection, builds the
      size-capped code context for HTTP Execution, and removes worktrees
      idempotently. It never trusts a model's claim that a change was applied.
  - id: http-model-adapters
    path: caliper/http_models.py
    kind: domain
    description: >
      Role adapters (planning/execution/review classes) over a chat client with a
      post() method; roles are provider-agnostic. The default client is the
      OpenAI-compatible HTTP ChatClient with test-injectable transport (this is
      how a local Ollama is reached). The planner must cite approved rule IDs
      only, the executor returns a fenced diff and, on a re-run, receives the
      failed rule verdicts plus the human note in its prompt, the reviewer must
      return exactly one JSON verdict per approved rule (duplicate keys are
      rejected). Disabled by default.
  - id: opencode-adapter
    path: caliper/opencode_models.py
    kind: domain
    description: >
      OpenCode CLI client, a post()-compatible stand-in for ChatClient: runs
      `opencode run --format json --model <provider/model>` as an argv array
      (never a shell string), bounded timeout, secret-token redaction in error
      output, plain-language failures for a missing executable, nonzero exit,
      timeout and empty/malformed output. --auto is never passed; OpenCode keeps
      its own credentials outside Caliper.
  - id: patch-safety
    path: caliper/patch_safety.py
    kind: domain
    description: >
      The only code path that applies a model-produced diff. Static validation
      rejects absolute paths, path traversal, backslash paths, .git internals,
      binary changes, and empty/overlarge/malformed output. Application is
      `git apply --check` then `git apply` (argv array, bounded timeout, stdin)
      inside one target worktree. Per-request isolation helpers create and remove
      one worktree on caliper/<request id>, never the default branch; removal is
      idempotent and refuses a symlinked path. Wired into request-workspace
      (D-031, D-046, D-047).
  - id: models-config
    path: caliper/models_config.py
    kind: domain
    description: >
      Loads/validates models.yaml (three roles, provider http|opencode, base_url,
      model, timeout, executable for opencode roles, keys under
      CALIPER_SECRETS_DIR created at 0600 in one os.open) and enforces three
      DISTINCT model ids at startup — the model id is the identity; the provider
      is only a transport. Blank roles block workflow runs; the factory builds
      HTTP role adapters backed by the ChatClient or the OpenCodeClient per role
      provider.
  - id: smoke-cli
    path: caliper/smoke.py
    kind: application
    description: >
      Developer smoke command `python -m caliper.smoke planning|execution|review
      [--timeout N]`: loads one configured role, sends one tiny prompt through the
      real provider and prints the reply. Never prints a saved API key; exits 1 with
      a plain reason when the role is not configured or the call fails.
  - id: deploy-adapter
    path: caliper/workflow.py
    kind: domain
    description: >
      Deploy adapter interface on Workflow, with NO runtime implementation yet.
      Approval now performs the real Git merge and push through request-workspace
      and sets merged only after the push succeeded; there is no marker file.
      With no adapter configured, Dev/Prod deploy calls raise
      DeploymentNotConfigured ("Deployment is not configured") and the UI shows
      that state instead of faking deployed_dev/live. Test doubles live under
      tests/. The SSH/docker adapter arrives in Phase 2.
  - id: principles
    path: caliper/principles.py
    kind: domain
    description: >
      Principle rule format (IDs of the form XXX-NNN), the three states
      (missing/draft/approved), the starter document (a heading and one
      instruction line, never invented rules) and PrinciplesService, which reads
      and writes .caliper/principles/*.md in the project repository and records
      the approval as a content hash plus a commit.
  - id: project-docs
    path: caliper/project_docs.py
    kind: domain
    description: >
      ProjectDocsService: reads and writes .caliper/manifest.yaml, .caliper/graph.yaml
      and append-only .caliper/decisions/*.md in the project repository. Reads the
      local clone for page loads, syncs on demand, creates only missing docs, and
      validates graph node/edge references. Graph and decisions are passed to the
      model prompts.
  - id: git-repo-access
    path: caliper/repo.py
    kind: infrastructure
    description: >
      Git access for one project repository through the git CLI and the project
      deploy key: clone, default branch detection, fetch/force-checkout of that
      branch, reading a file, and writing + committing + pushing one or many
      files to the default branch. request-workspace reuses this clone for the
      request branch, the approval merge and the push.
  - id: remote-access
    path: caliper/remote.py
    kind: infrastructure
    description: >
      SSH and key helpers: ed25519 key generation under CALIPER_SECRETS_DIR
      (mode 600), repository read/write probe (ls-remote plus push --dry-run),
      host key scanning and SHA256 fingerprinting, host key pinning in a
      per-environment known_hosts file, and the environment probe (ssh true,
      docker compose version, deploy path exists and writable) that maps every
      failure to a plain reason with the exact fix command.
  - id: project-registry
    path: caliper/registry.py
    kind: domain
    description: >
      ProjectRegistry: validation + id slug + persistence of the local runtime
      manifest.yaml (repo url and its verification, optional product field, the state
      of the six principles, dev/prod environment definitions and host key
      fingerprint), the per-project deploy key, the per-environment SSH keys and
      known_hosts files, and the repository/environment connection tests. The
      portable project manifest lives in .caliper/manifest.yaml in the repository.
  - id: request-store
    path: caliper/state.py
    kind: data-store
    description: >
      SQLite run state (CALIPER_DB_PATH default .caliper-state/state.sqlite3):
      request id/kind/text/extra/status/loop_count/review_note plus the Git
      evidence columns branch, worktree, base_commit, commit_sha, diff_hash,
      merge_commit and failure_reason (migrated in place), and append-only
      audit_events. Publishes committed changes to the event bus and supports
      single-request delete, cancel/restore, delete-in-one-transaction, and
      mark_interrupted which turns planning/executing/reviewing requests into a
      visible failure after a restart. Safely deletable.
  - id: event-bus
    path: caliper/events.py
    kind: infrastructure
    description: >
      In-process fan-out from request-store writes to per-browser SSE queues;
      bounded queues drop stale tokens for slow clients.
  - id: project-deletion
    path: caliper/deletion.py
    kind: domain
    description: >
      Safe remove-from-Caliper: cancel active requests, optional Dev/Prod stop
      before any deletion, abort on failure, remove only resolved paths under
      CALIPER_DATA_DIR/projects/<id> and CALIPER_SECRETS_DIR/projects/<id>, then
      delete DB rows plus audit. Never touches the GitHub repository or .caliper/.
  - id: app-ui
    path: caliper/templates
    kind: presentation
    description: >
      Transitional Jinja2 screens with vanilla JS: dashboard
      (needs-you/in-progress/recent), projects list, add form, project page with
      setup checklist/environments/delete dialog, request page (stepper, review rows
      failed-first, plan, diff, approve gates, request delete confirmation), composer,
      empty/missing/error states. Vanilla JS subscribes to SSE and updates request
      states without reload. This is NOT the target UI and does not conform to
      docs/UI_SYSTEM.md v2 (React + shadcn/ui); the React port replaces it (D-044).
  - id: project-store
    path: projects/
    kind: data-store
    description: >
      Runtime-only project data written by project-registry, request-workspace
      and workflow-engine: one directory per project (manifest, local clone of
      the repository, worktrees/<req> isolated request worktrees, and req-<n>/
      artifacts). Not committed; location overridable via CALIPER_PROJECTS_ROOT.
  - id: tests
    path: tests/
    kind: test-suite
    description: >
      pytest suite covering: scaffold smoke, registry, request state store,
      request UI flows, workflow engine (success path, review loop exhaustion,
      validation), workflow UI (run/approve gates), the real factory loop against
      temporary bare Git remotes (worktree commit, test gate, authoritative diff
      review, approval binding, real merge/push, unsafe diffs, conflicts, push
      rejection, OpenCode workspace edits, an HTTP adapter round trip against a
      real local HTTP model endpoint, interruption recovery), models.yaml
      validation incl. per-role providers and (provider, model)-aware config,
      HTTP adapters with fake transport, the OpenCode CLI adapter (argv
      construction without a shell, timeout, nonzero exit, missing binary,
      empty/malformed/redacted output), dashboard/global composer/status
      snapshot, repository access (deploy key, read/write probe), the
      principles/environments API (states, approval rules, Git round trip
      against a local repository, SSH key and ssh-copy-id command, host key
      pinning and a changed host key), project docs (.caliper
      manifest/graph/decisions Git round trip, invalid graph reporting, docs
      API/UI, decision authoring, prompt context), safe project deletion and SSE.
      Real ssh-keygen and ssh-keyscan tests skip with a reason when the tool is
      absent. Mock role adapters live only here.

